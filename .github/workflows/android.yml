name: Build Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore from Secret
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
        # 如果项目结构是根目录直接有 app，用上面这行
        # 如果 keystore 需要放在根目录，改成：echo "..." | base64 -d > release.jks

    - name: Build Universal Release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output
        
        # 自动查找生成的 APK（兼容不同项目结构）
        APK_PATH=$(find . -name "*release*.apk" -not -path "*/intermediates/*" | head -n 1)
        
        if [ -z "$APK_PATH" ]; then
          echo "错误：没有找到 release APK！"
          find . -name "*.apk" || true
          exit 1
        fi
        
        cp "$APK_PATH" "build_output/SnapNotes_${BUILD_TIME}_${COMMIT_HASH}.apk"
        echo "APK 已准备好：build_output/SnapNotes_${BUILD_TIME}_${COMMIT_HASH}.apk"
        ls -lh build_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapNotes-Release-APK
        path: build_output/*.apk
        retention-days: 30
