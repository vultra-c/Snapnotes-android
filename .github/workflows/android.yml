name: Build Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 预下载并安装 Gradle，绕过 Wrapper 的下载机制（Wrapper 独立下载常因网络问题失败）
    - name: Download and install Gradle 9.6.1
      run: |
        GRADLE_VERSION=9.6.1
        GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
        
        MIRRORS=(
          "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          "https://downloads.gradle-dn.com/distributions/gradle-${GRADLE_VERSION}-bin.zip"
        )
        
        DOWNLOAD_OK=false
        for url in "${MIRRORS[@]}"; do
          for i in 1 2 3; do
            echo "📥 Attempt $i: Downloading from $url ..."
            if wget -q --timeout=120 --tries=2 -O "/tmp/${GRADLE_ZIP}" "$url"; then
              echo "✅ Download succeeded from $url (attempt $i)"
              DOWNLOAD_OK=true
              break 2
            fi
            echo "❌ Attempt $i failed for $url"
            sleep 10
          done
        done
        
        if [ "$DOWNLOAD_OK" = false ]; then
          echo "💥 All download attempts failed from all mirrors"
          exit 1
        fi
        
        echo "📦 Extracting Gradle..."
        unzip -q "/tmp/${GRADLE_ZIP}" -d "$HOME"
        echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
        echo "✅ Gradle installed at $HOME/gradle-${GRADLE_VERSION}"

    # 缓存 Gradle User Home（依赖 + 插件），避免每次构建都重新下载
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success

    # 从 Secrets 还原签名文件 + properties
    - name: Setup Keystore for Signing
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
        cat > keystore.properties << 'PROPS_EOF'
        storeFile=release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        PROPS_EOF
        ls -l release.jks keystore.properties

    # 构建 APK，带重试机制应对瞬时网络问题（插件/依赖下载失败时自动重试）
    - name: Build Universal Release APK
      run: |
        for i in 1 2 3; do
          echo "🔨 Build attempt $i ..."
          if gradle assembleRelease --no-daemon --stacktrace; then
            echo "✅ Build succeeded on attempt $i"
            exit 0
          fi
          echo "❌ Build attempt $i failed"
          if [ $i -lt 3 ]; then
            echo "⏳ Waiting 20s before retry..."
            sleep 20
            # 清理可能损坏的配置缓存
            rm -rf .gradle/configuration-cache
          fi
        done
        echo "💥 All build attempts failed"
        exit 1

    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output
        
        APK_PATH=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
        
        if [ -z "$APK_PATH" ]; then
          echo "❌ 未找到 release APK，尝试查找所有 apk："
          find . -name "*.apk" || true
          exit 1
        fi
        
        FINAL_NAME="SnapNotes_${BUILD_TIME}_${COMMIT_HASH}.apk"
        cp "$APK_PATH" "build_output/$FINAL_NAME"
        echo "✅ APK 已准备好：$FINAL_NAME"
        ls -lh build_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapNotes-Release-APK
        path: build_output/*.apk
        retention-days: 30
