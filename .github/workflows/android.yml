name: Build Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. 执行 Release 统一打包命令
    - name: Build Universal Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 2. 提取并重命名产物（带上构建时间和 Commit Hash）
    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output
        
        # 将生成的 Release APK 复制并命名
        cp app/build/outputs/apk/release/*.apk build_output/app-release-universal_${BUILD_TIME}_${COMMIT_HASH}.apk
        echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV

    # 3. 上传构件
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-universal-${{ env.BUILD_TIME }}
        path: build_output/*.apk
        retention-days: 7
