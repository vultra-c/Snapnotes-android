name: Build Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 预下载并安装 Gradle，绕过 Wrapper 的下载机制（Wrapper 独立下载常因网络问题失败）
    # 尝试多个镜像源，带重试
    - name: Download and install Gradle 9.6.1
      run: |
        GRADLE_VERSION=9.6.1
        GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
        
        # 多个镜像源，按优先级尝试
        MIRRORS=(
          "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          "https://downloads.gradle-dn.com/distributions/gradle-${GRADLE_VERSION}-bin.zip"
        )
        
        DOWNLOAD_OK=false
        for url in "${MIRRORS[@]}"; do
          for i in 1 2 3; do
            echo "📥 Attempt $i: Downloading from $url ..."
            if wget -q --timeout=120 --tries=2 -O "/tmp/${GRADLE_ZIP}" "$url"; then
              echo "✅ Download succeeded from $url (attempt $i)"
              DOWNLOAD_OK=true
              break 2
            fi
            echo "❌ Attempt $i failed for $url"
            sleep 10
          done
        done
        
        if [ "$DOWNLOAD_OK" = false ]; then
          echo "💥 All download attempts failed from all mirrors"
          exit 1
        fi
        
        # 解压到 $HOME
        echo "📦 Extracting Gradle..."
        unzip -q "/tmp/${GRADLE_ZIP}" -d "$HOME"
        
        # 添加到 PATH（后续步骤可直接用 gradle 命令）
        echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
        
        # 验证安装
        echo "✅ Gradle installed at $HOME/gradle-${GRADLE_VERSION}"
        ls -la "$HOME/gradle-${GRADLE_VERSION}/bin/gradle"

    # 使用官方 setup-gradle action：缓存 Gradle User Home，加速依赖下载
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success

    # 从 Secrets 还原签名文件 + properties（最关键步骤）
    - name: Setup Keystore for Signing
      run: |
        # 还原 jks 文件到项目根目录
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
        
        # 动态生成 keystore.properties（不提交到仓库）
        cat > keystore.properties << 'PROPS_EOF'
        storeFile=release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        PROPS_EOF
        
        echo "Keystore 和 properties 已准备完成"
        ls -l release.jks keystore.properties

    - name: Build Universal Release APK
      # 直接使用 gradle 命令（已通过 PATH 注入），绕过 Wrapper 的下载机制
      run: gradle assembleRelease --no-daemon --stacktrace

    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output
        
        # 自动查找 release APK（兼容不同输出路径）
        APK_PATH=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
        
        if [ -z "$APK_PATH" ]; then
          echo "❌ 未找到 release APK，尝试查找所有 apk："
          find . -name "*.apk" || true
          exit 1
        fi
        
        FINAL_NAME="SnapNotes_${BUILD_TIME}_${COMMIT_HASH}.apk"
        cp "$APK_PATH" "build_output/$FINAL_NAME"
        
        echo "✅ APK 已准备好：$FINAL_NAME"
        ls -lh build_output/
        
        # 可选：验证签名
        echo "=== 签名信息 ==="
        $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "build_output/$FINAL_NAME" || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapNotes-Release-APK
        path: build_output/*.apk
        retention-days: 30
