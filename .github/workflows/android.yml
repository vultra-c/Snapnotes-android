name: Build Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 从 Secrets 还原签名文件 + properties（最关键步骤）
    - name: Setup Keystore for Signing
      run: |
        # 还原 jks 文件到项目根目录
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
        
        # 动态生成 keystore.properties（不提交到仓库）
        cat > keystore.properties << EOF
        storeFile=release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF
        
        echo "Keystore 和 properties 已准备完成"
        ls -l release.jks keystore.properties

    - name: Build Universal Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output
        
        # 自动查找 release APK（兼容不同输出路径）
        APK_PATH=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
        
        if [ -z "$APK_PATH" ]; then
          echo "❌ 未找到 release APK，尝试查找所有 apk："
          find . -name "*.apk" || true
          exit 1
        fi
        
        FINAL_NAME="SnapNotes_${BUILD_TIME}_${COMMIT_HASH}.apk"
        cp "$APK_PATH" "build_output/$FINAL_NAME"
        
        echo "✅ APK 已准备好：$FINAL_NAME"
        ls -lh build_output/
        
        # 可选：验证签名
        echo "=== 签名信息 ==="
        $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "build_output/$FINAL_NAME" || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapNotes-Release-APK
        path: build_output/*.apk
        retention-days: 30
