name: Build Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 使用官方 setup-gradle action：自动下载并缓存 Gradle 发行版 + 依赖
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 签名已入库（app/snapnotes.p12 项目共享签名，build.gradle.kts 三级回退默认使用），
    # 无需再从 Secrets 还原 release.jks：CI 与本地构建的 APK 签名完全一致，
    # 覆盖安装不再触发「签名不一致，是否先卸载」提示。
    # 若将来需要正式渠道独立签名：在仓库根目录放置 keystore.properties 及其指向的 jks，
    # build.gradle.kts 会自动优先使用它（三级回退第一级）。
    - name: Verify Shared Keystore Present
      run: ls -l app/snapnotes.p12

    # 构建 APK，带重试机制应对瞬时网络问题
    - name: Build Universal Release APK
      run: |
        for i in 1 2 3; do
          echo "🔨 Build attempt $i ..."
          if ./gradlew assembleRelease --no-daemon --stacktrace; then
            echo "✅ Build succeeded on attempt $i"
            exit 0
          fi
          echo "❌ Build attempt $i failed"
          if [ $i -lt 3 ]; then
            echo "⏳ Waiting 20s before retry..."
            sleep 20
            rm -rf .gradle/configuration-cache
          fi
        done
        echo "💥 All build attempts failed"
        exit 1

    - name: Prepare APK Artifact
      run: |
        BUILD_TIME=$(date +'%Y%m%d_%H%M')
        COMMIT_HASH=${GITHUB_SHA::7}
        mkdir -p build_output

        APK_PATH=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)

        if [ -z "$APK_PATH" ]; then
          echo "❌ 未找到 release APK，尝试查找所有 apk："
          find . -name "*.apk" || true
          exit 1
        fi

        FINAL_NAME="SnapNotes_${BUILD_TIME}_${COMMIT_HASH}.apk"
        cp "$APK_PATH" "build_output/$FINAL_NAME"
        echo "✅ APK 已准备好：$FINAL_NAME"
        ls -lh build_output/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnapNotes-Release-APK
        path: build_output/*.apk
        retention-days: 30
